name: workflow

permissions:
  contents: read

on: [ push ]

jobs:
  lint:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.12.13
      uses: actions/setup-python@v1
      with:
        python-version: 3.12.13
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    - name: Run Flake8
      run: |
        flake8 FastAPI_App/ FastAPI_ML/ match_prediction_app-front/

  tests:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.12.13
      uses: actions/setup-python@v1
      with:
        python-version: 3.12.13
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -r FastAPI_App/requirements.txt
        pip install -r FastAPI_ML/requirements.txt
    - name: Run tests with coverage
      run: |
        pytest --cov=./ --cov-report=xml
  
  login-to-dockerhub:
    runs-on: ubuntu-26.04
    needs: tests

    steps:
    - uses: actions/checkout@v2
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
  
  image-build:
    runs-on: ubuntu-26.04
    needs: login-to-dockerhub
    
    steps:
    - uses: actions/checkout@v2
    - name: Build and push Docker images
      run: |
        docker build -f dockerfile.apiml -t ghcr.io/hazelcunuder/fbpredml:1.0 .
        docker build -f dockerfile.api -t ghcr.io/hazelcunuder/fbpredapi:1.0 .
        docker build -f dockerfile.front -t ghcr.io/hazelcunuder/fbpredfront:1.0 .
        docker push ghcr.io/hazelcunuder/fbpredml:1.0
        docker push ghcr.io/hazelcunuder/fbpredapi:1.0
        docker push ghcr.io/hazelcunuder/fbpredfront:1.0