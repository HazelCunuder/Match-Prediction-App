services:
  database:
      image: postgres:17
      env_file: .env
      environment:
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_APP}
        POSTGRES_DB: ${POSTGRES_DB_APP}
      volumes:
        - db-app:/var/lib/postgresql/data
      ports:
        - "5432:5432"
      networks:
        - football_prediction

  football-api:
    build:
      context: .
      dockerfile: FastAPI_App/Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    networks:
      - football_prediction
    depends_on:
      - database

  football-ml:
    build:
      context: .
      dockerfile: FastAPI_ML/Dockerfile.api
    ports:
      - "8001:8001"
    env_file: .env
    networks:
      - football_prediction
    depends_on:
      - database

  football-front:
    build:
      context: .
      dockerfile: match_prediction_app-front/Dockerfile.front
    ports:
      - "8080:8080"
    networks:
      - football_prediction
    depends_on:
      - football-api
      - football-ml

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - football_prediction
    depends_on:
      - football-api
      - football-ml
      - football-front

networks:
  football_prediction

volumes:
  bdd_ml_foot:
  caddy_data:
  caddy_config: